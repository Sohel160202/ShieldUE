name: Validate ShieldUE repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate plugin descriptor and repository structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          descriptor = Path("ShieldUE.uplugin")
          data = json.loads(descriptor.read_text(encoding="utf-8"))

          required = [
              "FriendlyName",
              "Description",
              "Modules",
              "Version",
              "VersionName",
          ]
          missing = [key for key in required if key not in data]
          if missing:
              raise SystemExit(f"Missing plugin descriptor fields: {missing}")

          if not Path("Source/ShieldUE/ShieldUE.Build.cs").is_file():
              raise SystemExit("Missing ShieldUE.Build.cs")
          if not Path("LICENSE").is_file():
              raise SystemExit("Missing LICENSE")
          if not Path("SECURITY.md").is_file():
              raise SystemExit("Missing SECURITY.md")

          print(f"Validated ShieldUE {data['VersionName']} plugin descriptor")
          PY

      - name: Check trailing whitespace
        run: |
          if git grep -nI '[[:blank:]]$' -- . ':!*.png'; then
            echo "Trailing whitespace detected"
            exit 1
          fi
